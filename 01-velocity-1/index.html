<!doctype html>
<html>
  <head>
    <title>01-velocity-1</title>
    <style>
      canvas { border: 1px dashed; }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400"></canvas>
    <script type="module">
      import Ball from "../shared/Ball.js";

      window.onload = function () {
        let prevTime = 0;
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const ball = new Ball();
        const angle = Math.PI / 4;
        const speed = 100;
        ball.x = 50;
        ball.y = 100;

        function draw(time) {
          requestAnimationFrame(draw);
          const delta = (time - prevTime) / 1000;
          prevTime = time;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const vx = Math.cos(angle) * speed * delta;
          const vy = Math.sin(angle) * speed * delta;

          ball.x += vx;
          ball.y += vy;
          ball.draw(ctx);
        }
        requestAnimationFrame(draw);
      };
    </script>
  </body>
</html>
